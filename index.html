.c-feat { padding: 12px 14px 14px; }
.c-feat-head { display: flex; align-items: baseline; gap: 8px; margin-bottom: 8px; }
.c-feat-head b { font-size: 12.5px; letter-spacing: .08em; color: var(--accent); }
.c-feat-list { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 4px 10px; font-size: 12.5px; color: var(--ink-2); }
.c-feat-list li { display: flex; align-items: center; gap: 5px; }
.c-feat-list .ic { color: var(--accent); flex: none; }
.c-pdf-btn { margin-top: 8px; }

/* 글자 위치·크기 조절 */
.c-preview-box { touch-action: none; outline: none; }
.c-preview-box:focus-visible { box-shadow: 0 0 0 2px var(--accent-soft); }
.c-preview-box .mv { cursor: move; }
.c-move:empty { display: none; }
.c-move { margin-top: 10px; }
.c-move-tip { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--ink-3); }
.c-move-box { border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px 10px; background: var(--panel-2); display: flex; flex-direction: column; gap: 6px; }
.c-move-box .row { gap: 6px; }
.c-move-box .ic { color: var(--accent); }
.c-move-size .c-move-range { flex: 1; accent-color: var(--accent); }
.c-move-pct { min-width: 42px; text-align: right; font-variant-numeric: tabular-nums; }
.c-move-box .hint { font-size: 11.5px; color: var(--ink-3); }

/* 엑셀 불러오기 */
.c-imp-map { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0; }
.c-imp-map .chip { font-size: 12px; padding: 4px 9px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.c-imp-map .chip.off { background: var(--panel-2); color: var(--ink-3); font-weight: 500; }
.c-imp-wrap { overflow: auto; max-height: 260px; border: 1px solid var(--line); border-radius: 8px; }
.c-imp-table { border-collapse: collapse; width: 100%; font-size: 12.5px; }
.c-imp-table th, .c-imp-table td { padding: 6px 8px; border-bottom: 1px solid var(--line); text-align: left; white-space: nowrap; }
.c-imp-table th { background: var(--panel-2); position: sticky; top: 0; }
.c-feat-list li small { margin-left: 2px; font-size: 10.5px; font-weight: 700; color: #8a6a26; background: #f6ecd6; border-radius: 999px; padding: 1px 6px; }
</style>

  var BRAND_HINT = /브랜드|상호|회사|업체|로고|제조원|제조사|판매원|판매처|유통사|수입원|스토어|매장|홈페이지|웹사이트|연락처|전화|주소|brand|logo|company|manufacturer|website/i;

  function deluxeEditable(el) {
    var c = el.customer || {};

  // ───────────────────────── QR·바코드 ─────────────────────────
  var codeCache = {};

  // ───────────────────────── SVG 렌더 ─────────────────────────
  function labelShapeSVG(label, bx, by, attrs) {

  function elTransform(el) {

  function elementSVG(design, el, ctx) {
    if (!isVisible(el, ctx.values)) return '';
    var body = '', defs = '';
    var opacity = num(el.opacity, 1);
    var color = colorOf(el, ctx.values);
    var cid = ctx.prefix + '-' + el.id;
    switch (el.type) {
      case 'text': {

          (num(el.letterSpacing, 0) ? ' letter-spacing="' + f(el.letterSpacing * L.sizeMM) + '"' : '') +
          (sw > 0 ? ' stroke="' + esc(el.strokeColor || '#fff') + '" stroke-width="' + f(sw) + '" stroke-linejoin="round" paint-order="stroke"' : '');
        if (!isTransparent(el.bg)) body = '<rect width="' + f(el.w) + '" height="' + f(el.h) + '"' + (num(el.bgRadius, 0) ? ' rx="' + f(el.bgRadius) + '"' : '') + ' fill="' + esc(el.bg) + '"/>';
        body += '<text ' + attrs + ' xml:space="preserve">' + L.lines.map(function (line, i) {

      }
      case 'image': {
        var src = ctx.assets[assetOf(el, ctx.values)];

            '<text x="' + f(el.w / 2) + '" y="' + f(el.h / 2 + 1) + '" font-size="' + f(Math.min(3, el.h / 3)) + '" text-anchor="middle" fill="#868e96" font-family="sans-serif">이미지</text>';
          break;
        }
        var par = el.fit === 'cover' ? 'xMidYMid slice' : el.fit === 'fill' ? 'none' : 'xMidYMid meet';
        var rr = num(el.radius, 0);

        }

  /* 라벨 1개를 SVG 조각으로 만듭니다 (바깥 <svg> 없음).

  // ───────────────────────── 캔버스 렌더 (PNG 저장용) ─────────────────────────
  var imgCache = {};

    c.arcTo(x + w, y, x + w, y + h, r);
    c.arcTo(x + w, y + h, x, y + h, r);

  async function labelCanvas(design, opts) {

    var values = opts.values || {}, assets = opts.assets || {};
    await waitFonts(usedFontsOfDesign(design));

    cv.width = Math.round((label.w + bl * 2) * s);
    cv.height = Math.round((label.h + bl * 2) * s);

      var el = effEl(design.elements[i], values);
      if (!isVisible(el, values)) continue;
      c.save();
      c.translate(el.x, el.y);
      if (num(el.rotate, 0)) { c.translate(el.w / 2, el.h / 2); c.rotate(el.rotate * Math.PI / 180); c.translate(-el.w / 2, -el.h / 2); }

      await drawElement(c, design, el, values, assets);
      c.restore();
    }
    c.restore();
    return cv;
  }

  async function drawElement(c, design, el, values, assets) {
    var color = colorOf(el, values);
    switch (el.type) {
      case 'text': {
        var text = displayText(design, el, values);
        var L = layoutText(el, text);
        c.font = canvasFont(el, L.sizeMM);
        c.textBaseline = 'alphabetic';
        c.textAlign = el.align === 'left' ? 'left' : el.align === 'right' ? 'right' : 'center';

        c.restore();

      }

        if (el.type === 'rect') roundRectPath(c, sw2 / 2, sw2 / 2, Math.max(0, el.w - sw2), Math.max(0, el.h - sw2), num(el.radius, 0));

      }
      case 'line': {

        c.lineWidth = sw3; c.strokeStyle = color; setDash(c, el, sw3); c.stroke();
        break;
      }
      case 'qr': {
        var q = qrModules(rawText(design, el, values), el.ecc);
        if (!q) break;
        var g = qrGeometry(el, q);
        if (!isTransparent(el.bg)) { c.fillStyle = el.bg; c.fillRect((el.w - g.side) / 2, (el.h - g.side) / 2, g.side, g.side); }

    if (R.planBadge) R.planBadge.textContent = (F.lock === 'identity' ? '등록 품목 ' : 'DELUXE · 품목 ') + list.length + '개';
    list.forEach(function (it, i) {
      var on = it.id === cur.id;
      var chip = h('div', { class: 'c-item' + (on ? ' on' : '') },
        h('button', { type: 'button', class: 'c-item-main', onclick: function () { st.cur[d.id] = it.id; SEL = null; save(); renderAll(); } },
          h('span', { class: 'c-item-thumb', html: thumbSVG(d, it) }),
          h('span', { class: 'c-item-name', text: itemName(it, i) })),
        on && F.items ? h('div', { class: 'c-item-acts' },
          btn('', { icon: 'edit', small: true, kind: 'ghost', title: '이름 바꾸기', onClick: function () { renameItem(it, i); } }),
          btn('', { icon: 'copy', small: true, kind: 'ghost', title: '복제', onClick: function () { dupItem(it); } }),
          list.length > 1 ? btn('', { icon: 'trash', small: true, kind: 'ghost', title: '삭제', onClick: function () { delItem(it); } }) : null) : null

    });
    if (!F.items) R.items.appendChild(h('p', { class: 'muted small c-item-hint', text: F.lock === 'identity' ? '납품 때 등록한 제품이에요. 제품을 늘리거나 바꾸려면 제작자에게 "제품 추가"를 요청해 주세요.' : '납품 때 정한 품목이에요. 품목을 늘리려면 품목 추가 옵션이나 PREMIUM이 필요해요.' }));
    else if (list.length === 1) R.items.appendChild(h('p', { class: 'muted small c-item-hint', text: '맛·종류가 여러 개면 "품목 추가"로 각각 만들거나 엑셀로 한 번에 불러오고, 한 장에 섞어서 인쇄할 수 있어요.' }));
  }
  function thumbSVG(d, it) {
    var L = d.label;
    return '<svg viewBox="-0.5 -0.5 ' + (L.w + 1) + ' ' + (L.h + 1) + '" width="40" height="' + Math.round(40 * L.h / L.w) + '" style="max-height:40px">' +
      C.labelSVG(d, { values: valuesOf(it), assets: allAssets(), prefix: 't' + it.id }) +
      C.labelShapeSVG(L, 0, 0, 'fill="none" stroke="#ced4da" stroke-width="0.4"') + '</svg>';
  }
  function addItem() {
    var d = design(), cur = curItem();
    var it = newItem(d, '', 0);
    it.values = C.clone(cur.values); // 지금 품목 내용을 복사해서 시작
    st.items.push(it);
    st.cur[d.id] = it.id;
    save(); renderAll();
    U.toast('새 품목을 만들었어요. 바뀌는 내용만 고치세요.', 'ok');
    var first = R.form.querySelector('input, textarea, select');
    if (first) first.focus();
  }
  function dupItem(it) {
    var c = C.clone(it); c.id = C.uid('i'); c.name = itemName(it) + ' 복사'; delete c.nameEl;
    st.items.splice(st.items.indexOf(it) + 1, 0, c);
    st.cur[it.designId] = c.id; save(); renderAll();
  }
  async function delItem(it) {
    if (!(await U.confirm('품목 삭제', '"' + itemName(it) + '" 품목을 삭제할까요?', '삭제', 'danger'))) return;
    st.items = st.items.filter(function (x) { return x.id !== it.id; });
    st.cur[it.designId] = itemsOf(design())[0].id;
    save(); renderAll();
  }
  function renameItem(it, i) {
    var inp = h('input', { class: 'inp', value: it.name || itemName(it, i), placeholder: '예: 딸기잼 250g' });
    U.modal({ title: '품목 이름', body: [h('div', { class: 'field' }, h('label', { text: '목록에서 구분하기 위한 이름이에요 (인쇄되지 않아요)' }), inp)],
      actions: [{ label: '취소' }, { label: '저장', primary: true, onClick: function () { it.name = inp.value.trim(); delete it.nameEl; save(); renderItems(); renderPrint(); } }] });
  }

  // ───────────────────────── 입력 폼 ─────────────────────────
  function onValue(rebuildForm) {
    save();
    if (!rebuildForm) refreshDerived();
    renderPreviewSoon();
    renderItemsSoon();
    renderPrintSoon();
    if (rebuildForm) renderForm();
  }
  // 날짜 자동 계산처럼 다른 칸 값에 따라 바뀌는 표시만 갱신 (입력 중 포커스 유지)
  function refreshDerived() {
    var d = design(), values = valuesOf(curItem());
    Array.prototype.forEach.call(R.form.querySelectorAll('[data-derived]'), function (n) {
      var el = C.findEl(d, n.getAttribute('data-derived'));
      if (el) n.textContent = (n.getAttribute('data-prefix') || '') + (C.displayText(d, el, values) || '—');
    });
  }
  var renderPreviewSoon = U.rafThrottle(function () { renderPreview(); });
  var renderItemsSoon = U.debounce(function () { renderItems(); }, 250);
  var renderPrintSoon = U.debounce(function () { renderPrint(); }, 300);

  function renderForm() {
    U.clear(R.form);
    var d = design(), item = curItem();
    var fields = C.editableFields(d);
    if (!fields.length) { R.form.appendChild(h('p', { class: 'muted', text: '이 디자인은 고칠 항목이 없어요. 바로 인쇄하면 됩니다.' })); return; }
    var values = valuesOf(item);
    fields.forEach(function (el) {
      var c = el.customer;
      var slot = slotFor(item, el);
      var label = c.label || el.name;
      var wrap = h('div', { class: 'c-field' + (c.locked ? ' is-locked' : ''), 'data-el': el.id });
      var head = h('div', { class: 'c-field-head' }, h('label', { for: 'f-' + el.id, text: label }),
        c.locked ? h('span', { class: 'badge gray', title: lockNote(), text: '고정' }) :
        c.shared ? h('span', { class: 'badge gray', title: '모든 품목에 똑같이 들어가요', text: '공통' }) : null);
      wrap.appendChild(head);
      if (c.locked) {
        wrap.appendChild(lockedControl(d, el, values));
        if (c.colorEditable && F.color) wrap.appendChild(colorControl(el, slot)); // DELUXE 색상 선택 옵션: 글자는 잠겨도 색은 고름
        R.form.appendChild(wrap); return;
      }
      var visible = C.isVisible(el, values);
      if (c.toggle) {
        var tg = h('input', { type: 'checkbox', checked: visible, id: c.editable || c.imageEditable || c.colorEditable ? null : 'f-' + el.id,
          onchange: function () { slot.visible = tg.checked; onValue(true); } });
        head.appendChild(h('label', { class: 'switch', title: '인쇄에 넣기/빼기' }, tg, h('span', { class: 'switch-ui' }), h('span', { class: 'small', text: visible ? '넣기' : '빼기' })));
      }
      if (c.toggle && !visible) { wrap.classList.add('is-off'); R.form.appendChild(wrap); return; }
      if (c.editable && el.type === 'text') wrap.appendChild(textControl(d, el, slot, values));
      if (c.editable && (el.type === 'qr' || el.type === 'barcode')) wrap.appendChild(codeControl(d, el, slot));
      if (c.imageEditable && el.type === 'image') wrap.appendChild(imageControl(el, slot));
      if (c.colorEditable && F.color) wrap.appendChild(colorControl(el, slot));
      if (c.help) wrap.appendChild(h('div', { class: 'hint', text: c.help }));
      wrap.appendChild(h('div', { class: 'c-warn', 'data-warn': el.id }));
      R.form.appendChild(wrap);
    });
    updateFieldWarnings();
  }

  // DELUXE: 납품 때 정한 칸은 보기만
  function lockedControl(d, el, values) {
    var c = el.customer, parts = [icon('lock', 14)];
    if (c.editable && (el.type === 'text' || el.type === 'barcode')) parts.push(h('span', { class: 'pre', text: C.displayText(d, el, values) || '—' }));
    else if (c.toggle && !c.colorEditable) parts.push(h('span', { text: C.isVisible(el, values) ? '넣기' : '빼기' }));
    if (c.colorEditable && !F.color) parts.push(h('span', { class: 'c-sw-mini', style: { background: C.colorOf(el, values) } }));
    return h('div', { class: 'c-ctl' }, h('div', { class: 'readonly c-locked', id: 'f-' + el.id }, parts), h('div', { class: 'hint', text: lockNote() }));
  }
  // DELUXE 유통기한: 고객이 날짜를 직접 넣어요 (비우면 라벨에 표시 안 함)
  function expiryControl(d, el, slot, values) {
    var di2 = h('input', { type: 'date', class: 'inp', id: 'f-' + el.id, value: C.parseISO(slot.text) ? slot.text : '' });
    di2.addEventListener('input', function () { slot.text = di2.value || ''; onValue(); });
    return h('div', { class: 'c-ctl' },
      h('div', { class: 'row' }, di2, btn('지우기', { small: true, kind: 'ghost', onClick: function () { slot.text = ''; onValue(true); } })),
      h('div', { class: 'hint', 'data-derived': el.id, 'data-prefix': '인쇄되는 모양: ', text: '인쇄되는 모양: ' + (C.displayText(d, el, values) || '—') }),
      h('div', { class: 'hint', text: '날짜를 직접 넣어요. 비워 두면 라벨에 표시되지 않아요. 제조일이 바뀌면 함께 바꿔 주세요.' }));
  }
  function resetBtn(slot, keys, title) {
    return btn('', { icon: 'undo', small: true, kind: 'ghost', title: title || '원래대로', onClick: function () { keys.forEach(function (k) { delete slot[k]; }); onValue(true); } });
  }

  function textControl(d, el, slot, values) {
    var c = el.customer;
    var cur = slot.text != null ? slot.text : el.text;
    var id = 'f-' + el.id;
    switch (c.input) {
      case 'multiline': {
        var ta = h('textarea', { class: 'inp', id: id, rows: 3, maxlength: c.maxLength > 0 ? c.maxLength : null });
        ta.value = cur;
        ta.addEventListener('input', function () { slot.text = ta.value; onValue(); counter(); });
        var cnt = h('span', { class: 'c-count' });
        var counter = function () { cnt.textContent = c.maxLength > 0 ? ta.value.length + ' / ' + c.maxLength : ''; };
        counter();
        return h('div', { class: 'c-ctl' }, ta, h('div', { class: 'row c-ctl-foot' }, cnt, h('div', { class: 'spacer' }), slot.text != null && slot.text !== el.text ? resetBtn(slot, ['text']) : null));
      }
      case 'select': {
        var opts = String(c.options || '').split('\n').map(function (s) { return s.trim(); }).filter(Boolean);
        var sel = h('select', { class: 'inp', id: id });
        opts.forEach(function (o) { sel.appendChild(h('option', { value: o, text: o })); });
        if (opts.indexOf(cur) < 0) sel.insertBefore(h('option', { value: cur, text: cur }), sel.firstChild);
        sel.value = cur;
        sel.addEventListener('change', function () { slot.text = sel.value; onValue(); });
        return sel;
      }
      case 'date': {
        if (c.directExpiry) return expiryControl(d, el, slot, values);
        var useToday = slot.today != null ? slot.today : !!c.today;
        var iso = C.dateISOFor(d, el, values);
        var di2 = h('input', { type: 'date', class: 'inp', id: id, value: C.parseISO(iso) ? iso : C.todayISO(), disabled: useToday });
        di2.addEventListener('input', function () { if (di2.value) { slot.text = di2.value; slot.today = false; onValue(); } });
        var cb = h('input', { type: 'checkbox', checked: useToday, onchange: function () {
          slot.today = cb.checked;
          if (!cb.checked && !slot.text) slot.text = C.todayISO();
          onValue(true);
        } });
        return h('div', { class: 'c-ctl' }, h('div', { class: 'row' }, di2, h('label', { class: 'check nowrap' }, cb, '항상 오늘 날짜')),
          h('div', { class: 'hint', 'data-derived': el.id, 'data-prefix': '인쇄되는 모양: ', text: '인쇄되는 모양: ' + C.displayText(d, el, values) }));
      }
      case 'dateCalc': { // PREMIUM: 제조일 + 유통기간 → 유통기한 자동 계산
        var base = C.findEl(d, c.baseId);
        var unitName = { day: '일', month: '개월', year: '년' }[c.unit] || '일';
        var offInp = h('input', { class: 'inp num', id: id, type: 'number', min: 0, step: 1, inputmode: 'numeric', value: slot.offset != null ? slot.offset : c.offset, 'aria-label': '유통기간(' + unitName + ')' });
        offInp.addEventListener('input', function () {
          var v = offInp.value.trim();
          if (v === '' || !isFinite(parseFloat(v))) delete slot.offset; else slot.offset = Math.max(0, Math.round(parseFloat(v)));
          onValue();
        });
        return h('div', { class: 'c-ctl' },
          h('div', { class: 'row c-inline' }, h('span', { class: 'affix', text: (base ? (base.customer.label || base.name) : '기준 날짜') + ' +' }), offInp,
            h('span', { class: 'affix', text: unitName + (c.minus1 ? ' - 1일' : '') }), slot.offset != null ? resetBtn(slot, ['offset']) : null),
          h('div', { class: 'readonly', 'data-derived': el.id, text: C.displayText(d, el, values) || '—' }),
          h('div', { class: 'hint', text: '유통기간을 바꾸면 날짜가 자동으로 계산돼요. 말일도 맞춰요 (예: 8월 31일 + 6개월 = 2월 28일).' }));
      }
      default: {
        var inp = h('input', { class: 'inp', id: id, type: 'text', maxlength: c.maxLength > 0 ? c.maxLength : null, inputmode: c.input === 'number' ? 'decimal' : null });
        inp.value = cur;
        inp.addEventListener('input', function () { slot.text = inp.value; onValue(); cnt2.textContent = c.maxLength > 0 ? inp.value.length + '/' + c.maxLength : ''; });
        var cnt2 = h('span', { class: 'c-count', text: c.maxLength > 0 ? String(cur).length + '/' + c.maxLength : '' });
        var parts = [inp];
        if (el.prefix || el.suffix) parts = [el.prefix ? h('span', { class: 'affix', text: el.prefix.trim() }) : null, inp, el.suffix ? h('span', { class: 'affix', text: el.suffix.trim() }) : null];
        return h('div', { class: 'c-ctl' }, h('div', { class: 'row c-inline' }, parts, cnt2, slot.text != null && slot.text !== el.text ? resetBtn(slot, ['text']) : null));
      }

  }

  function codeControl(d, el, slot) {
    var cur = slot.text != null ? slot.text : el.text;
    var inp = h('input', { class: 'inp', id: 'f-' + el.id, value: cur, inputmode: el.type === 'barcode' ? 'numeric' : null, placeholder: el.type === 'qr' ? 'https://' : '880으로 시작하는 13자리' });
    var note = h('div', { class: 'hint' });
    var check = function () {
      var v = inp.value;
      if (el.type === 'barcode') {
        var e = C.eanData(v);
        note.className = e.ok ? 'hint' : 'hint bad';
        note.textContent = e.ok ? '인쇄될 번호: ' + e.digits : (e.error === 'EAN_CHECKSUM' ? '마지막 자리(검증번호)가 맞지 않아요. 앞 12자리만 넣어도 돼요.' : '숫자 12~13자리를 입력하세요.');
      } else {
        var q = C.qrModules(v, el.ecc);
        var mm = q ? Math.min(el.w, el.h) / (q.size + 2 * C.num(el.quiet, 1)) : 0;
        note.className = !q || mm < 0.33 ? 'hint bad' : 'hint';
        note.textContent = !q ? '내용이 너무 길어요.' : mm < 0.33 ? '주소가 길어서 QR이 너무 촘촘해요. 짧은 주소(단축 URL)를 쓰세요.' : '인쇄 후 휴대폰 카메라로 꼭 확인해 보세요.';

  }

  function imageControl(el, slot) {
    var has = !!slot.asset;
    return h('div', { class: 'row' },
      btn(has ? '다른 이미지로' : '이미지 바꾸기', { icon: 'upload', small: true, onClick: async function () {
        var file = await C.pickFile('image/*'); if (!file) return;

  function colorControl(el, slot) {

    var cur = slot.color || el[key];
    var opts = String(el.customer.colorOptions || '').split(/[\s,]+/).filter(function (x) { return /^#[0-9a-f]{6}$/i.test(x); });
    if (opts.length) {
      if (opts.map(function (x) { return x.toLowerCase(); }).indexOf(String(el[key]).toLowerCase()) < 0 && /^#[0-9a-f]{6}$/i.test(el[key])) opts.unshift(el[key]);
      var wrap = h('div', { class: 'c-swatches', role: 'radiogroup', 'aria-label': '색상' });
      opts.forEach(function (col) {
        var on = String(cur).toLowerCase() === col.toLowerCase();
        wrap.appendChild(h('button', { type: 'button', role: 'radio', 'aria-checked': on ? 'true' : 'false', class: 'c-sw' + (on ? ' on' : ''), title: col, style: { background: col },
          onclick: function () { slot.color = col; onValue(true); } }));
      });
      return h('div', { class: 'c-ctl' }, sub, wrap);
    }
    return h('div', { class: 'c-ctl' }, sub, h('div', { class: 'row' },
      U.colorField(cur, function (v) { slot.color = v; onValue(); }, function () { renderForm(); }, { label: '색상' }),
      slot.color ? resetBtn(slot, ['color'], '원래 색') : null));
  }

  function updateFieldWarnings() {
    Array.prototype.forEach.call(R.form.querySelectorAll('[data-warn]'), function (n) {
      var r = report[n.getAttribute('data-warn')];
      n.className = 'c-warn';
      n.textContent = '';

      if (r.overflow) { n.className = 'c-warn bad'; n.textContent = '글자가 칸보다 길어서 잘려요. 조금 줄여 주세요.'; }
      else if (r.shrunk) { n.textContent = '글자가 길어서 조금 작게(' + C.round(r.pt, 1) + 'pt) 인쇄돼요.'; }
    });
  }

  // ───────────────────────── 미리보기 ─────────────────────────
  function renderPreview() {
    var d = design(), L = d.label, item = curItem();
    report = {};
    var pad = Math.max(2, Math.max(L.w, L.h) * 0.04);
    var svg = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="' + (-pad) + ' ' + (-pad) + ' ' + (L.w + pad * 2) + ' ' + (L.h + pad * 2) + '" class="c-label-svg" role="img" aria-label="라벨 미리보기">' +
      '<defs><filter id="cps" x="-10%" y="-10%" width="120%" height="120%"><feDropShadow dx="0" dy="' + (L.h * 0.006) + '" stdDeviation="' + (Math.max(L.w, L.h) * 0.008) + '" flood-opacity=".18"/></filter></defs>' +
      '<g filter="url(#cps)">' + C.labelShapeSVG(L, 0, 0, 'fill="#fff"') + '</g>' +
      C.labelSVG(d, { values: valuesOf(item), assets: allAssets(), prefix: 'pv', report: report, markOverflow: true, hit: true }) +
      C.labelShapeSVG(L, 0, 0, 'fill="none" stroke="#ced4da" stroke-width="' + (Math.max(L.w, L.h) / 400) + '"') + selOverlay(d, item) + '</svg>';
    R.preview.innerHTML = svg;
    Array.prototype.forEach.call(R.preview.querySelectorAll('[data-id]'), function (g) { if (movableEl(d, g.getAttribute('data-id'))) g.classList.add('mv'); });
    R.preview.style.setProperty('--ar', L.w / L.h);
    R.previewSize.textContent = itemName(item) + ' · ' + C.round(L.w, 1) + '×' + C.round(L.h, 1) + 'mm';
    var over = Object.keys(report).filter(function (k) { return report[k].overflow; }).length;
    R.previewNote.innerHTML = '';
    if (over) R.previewNote.appendChild(h('div', { class: 'callout danger' }, icon('alert', 16), h('span', { text: '빨간 점선 칸의 글자가 넘쳐요. 내용을 줄여 주세요.' })));
    updateFieldWarnings();
  }

  // ───────────────────────── 글자 위치·크기 조절 ─────────────────────────
  // 고객은 글자(와 PREMIUM의 QR)만 옮기고 키울 수 있어요. 로고·배경·테두리·색·글꼴은 그대로
  function movableEl(d, id) {
    var el = id ? C.findEl(d, id) : null;
    if (!el || el.hidden || !el.customer.editable) return null;
    return el.type === 'text' || (el.type === 'qr' && F.qr) ? el : null;
  }
  function layoutSlot(el) { return slotFor(curItem(), el); }
  function setLayout(el, dx, dy, k) {
    var slot = layoutSlot(el);

      { label: '취소' },
      { label: '기존 목록에 추가', onClick: function () { apply(false); } },
      { label: '목록 바꾸기', primary: true, onClick: function () { apply(true); } }
    ] });
  }
  // 이 라벨에 맞는 엑셀 양식 (제목 줄 + 지금 품목들)
  function downloadTemplate() {
    var d = design();
    var rows = C.templateTable(d, itemsOf(d).map(function (it) { return { values: valuesOf(it), count: it.count || 0 }; }));
    var header = rows[0];
    var name = C.safeName(P.meta.title) + '_품목_양식';
    if (typeof XLSX !== 'undefined') {
      var wb = XLSX.utils.book_new(), ws = XLSX.utils.aoa_to_sheet(rows);
      ws['!cols'] = header.map(function (t) { return { wch: Math.max(10, String(t).length * 2 + 2) }; });
      XLSX.utils.book_append_sheet(wb, ws, '품목');
      var out = XLSX.write(wb, { type: 'array', bookType: 'xlsx' });
      C.download(new Blob([out], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' }), name + '.xlsx', 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet');
    } else {
      var csv = rows.map(function (r) { return r.map(function (c) { c = String(c == null ? '' : c); return /[",\n]/.test(c) ? '"' + c.replace(/"/g, '""') + '"' : c; }).join(','); }).join('\r\n');
      C.download(new Blob(['\uFEFF' + csv], { type: 'text/csv' }), name + '.csv', 'text/csv');
    }
  }

  return { boot: boot };
})();
</script>
<script>LabelCustomer.boot(JSON.parse(document.getElementById("label-data").textContent));</script>
